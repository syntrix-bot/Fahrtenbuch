<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fahrtenbuch</title>
  <meta name="description" content="Gemeinsames Fahrtenbuch: Fahrten und Autokosten fair nach Kilometern aufteilen.">
  <meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Fahrtenbuch">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png?v=2" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1><span id="title">Fahrtenbuch</span> <span id="sync-dot" class="sync-dot" hidden></span></h1>
    <button id="add-btn" class="icon-btn" aria-label="Hinzufügen" hidden>＋</button>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar" hidden>
    <button data-tab="overview" class="active"><span>📊</span>Übersicht</button>
    <button data-tab="trips"><span>🚗</span>Fahrten</button>
    <button data-tab="expenses"><span>💶</span>Kosten</button>
    <button data-tab="settings"><span>⚙️</span>Einstellungen</button>
  </nav>

  <div id="sheet-backdrop" class="sheet-backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" hidden></section>

  <script type="module" src="app.js"></script>
</body>
</html>
